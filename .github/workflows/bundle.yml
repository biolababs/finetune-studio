name: Build source bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - bundle-v*

permissions: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check application
        run: npm run check
      - name: Build bundle
        run: npm run bundle
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: finetune-studio-source
          path: release/finetune-studio-source.tar.gz
      - name: Publish source bundle
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG="bundle-${GITHUB_SHA:0:7}"
          fi
          gh release create "$TAG" release/finetune-studio-source.tar.gz \
            --title "Finetune Studio $TAG" \
            --notes "Source bundle with Finetune Studio, WebSLM Trainer, and Liquid Finetune. See the included README for setup and licenses."
